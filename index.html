<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#12432d" />
    <meta name="description" content="RuraLearn - Offline Learning Platform for Rural Students and Lifelong Learners" />
    <link rel="manifest" href="/manifest.json" />
    <title>RuraLearn – Offline Learning Platform</title>
  </head>
  <body class="bg-slate-50 text-slate-900 selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
